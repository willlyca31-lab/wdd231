<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Appointment Request</title>

  <meta name="description" content="Request an appointment with a psychologist.">

  <meta name="author" content="Willy">

  <link rel="icon" href="favicon.ico">

  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/larger.css">

  <script type="module" src="js/main.js"></script>
</head>

<body>

<header>
  <div class="logo-container">
    <img src="images/logo.webp" alt="GoodMind Logo" width="60" height="60">
    <span>GoodMind Psychology Network</span>
  </div>

  <button id="menu-button" aria-label="Open Navigation Menu">
    ☰
  </button>

  <nav>
    <ul class="navigation">
      <li><a href="index.html" class="active">Home</a></li>
      <li><a href="directory.html">Directory</a></li>
      <li><a href="resources.html">Resources</a></li>
      <li><a href="appointment.html">Appointment</a></li>
    </ul>
  </nav>
</header>

<main>

  <h1>Appointment Request Form</h1>

  <form method="get" action="confirmation.html">

    <label for="fullname">Full Name</label>
    <input type="text" id="fullname" name="fullname" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" name="phone">

    <label for="specialty">Preferred Specialty</label>

    <select id="specialty" name="specialty">

      <option value="Anxiety">Anxiety</option>

      <option value="Depression">Depression</option>

      <option value="Family Therapy">Family Therapy</option>

      <option value="Stress Management">Stress Management</option>

    </select>

    <label for="message">Message</label>

    <textarea id="message" name="message"></textarea>

    <button type="submit">Submit Request</button>

  </form>

</main>

<footer>
  <p>&copy; <span id="year"></span> GoodMind Psychology Network</p>
  <p id="lastModified"></p>
</footer>

</body>
</html>
